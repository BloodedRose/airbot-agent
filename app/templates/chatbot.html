<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRBOT Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        .chat-container { max-height: 75vh; overflow-y: auto; scroll-behavior: smooth; }
        .tool-block { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.82rem; }

        /* Smooth Fade In Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }

        /* Spinner for Table & File Loading */
        .loader {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Shimmer Skeleton for Table Loading */
        @keyframes shimmer {
            0% { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 800px 100%;
            animation: shimmer 1.4s infinite linear;
        }

        /* Sticky Table Header & Scroll Container */
        .data-table th { background-color: #f8fafc; position: sticky; top: 0; z-index: 10; }
        .data-table-container { max-height: 400px; overflow: auto; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen items-center justify-center">

    <div class="w-full max-w-6xl bg-white shadow-xl rounded-lg overflow-hidden flex flex-col h-[95vh]">
        <!-- Header -->
        <div class="bg-blue-800 text-white p-4 flex flex-wrap gap-3 justify-between items-center shadow-md z-20">
            <h1 class="font-bold text-xl tracking-wide">AIRBOT Enterprise</h1>
            <div class="flex flex-wrap items-center gap-3">
                <input type="email" id="userEmail" placeholder="Your Email" class="text-black p-1.5 text-sm rounded w-48 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-inner">
                <input type="text" id="modelName" placeholder="Model (e.g. gpt-4o)" class="text-black p-1.5 text-sm rounded w-40 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-inner">
                <input type="text" id="mcpNames" placeholder="MCPs (comma sep)" class="text-black p-1.5 text-sm rounded w-48 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-inner">
                <label class="flex items-center gap-1.5 text-sm font-semibold whitespace-nowrap cursor-pointer">
                    <input type="checkbox" id="plannerToggle" class="w-4 h-4 text-blue-600 rounded"> Planner
                </label>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chatBox" class="chat-container flex-1 p-6 flex flex-col gap-5 bg-slate-50 relative"></div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t flex gap-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
            <button onclick="clearHistory()" class="bg-slate-500 text-white px-5 py-3 rounded-lg font-bold hover:bg-slate-600 transition-colors shadow-sm" title="Clear Chat History">Clear</button>
            <input type="text" id="userInput" placeholder="Ask the agent..." class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-inner text-gray-800" onkeypress="handleEnter(event)">
            <button onclick="sendMessage()" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-sm">Send</button>
        </div>
    </div>

    <script>
        let chatHistory = [];
        const API_BASE = "http://127.0.0.1:8000";

        // --- Utilities ---
        function escapeHTML(str) {
            if (str === null || str === undefined) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatBytes(bytes) {
            if (!bytes || isNaN(bytes)) return "";
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
        }

        function formatRawResultForToolBox(rawResult, parsedResult) {
            if (parsedResult && typeof parsedResult === "object") {
                return JSON.stringify(parsedResult, null, 2);
            }
            if (typeof rawResult === "object") {
                return JSON.stringify(rawResult, null, 2);
            }
            return String(rawResult ?? "");
        }

        function appendMessage(role, content) {
            const div = document.createElement("div");
            div.className = `p-4 rounded-xl max-w-[90%] animate-fade-in shadow-sm ${
                role === 'user'
                    ? 'bg-blue-100 self-end text-blue-900 rounded-br-none'
                    : 'bg-white border border-slate-200 self-start text-gray-800 rounded-bl-none w-full'
            }`;
            div.innerHTML = `<div class="content-wrapper whitespace-pre-wrap leading-relaxed">${escapeHTML(content)}</div>`;
            document.getElementById("chatBox").appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            const box = document.getElementById("chatBox");
            box.scrollTop = box.scrollHeight;
        }

        function clearHistory() {
            chatHistory = [];
            document.getElementById("chatBox").innerHTML = '';
        }

        // --- Attachment Download Logic (Auto-download + Re-download) ---
        async function triggerFileDownload(fileId, filename, statusElId = null) {
            const statusEl = statusElId ? document.getElementById(statusElId) : null;
            if (statusEl) {
                statusEl.innerHTML = `
                    <span class="inline-flex items-center text-blue-600 font-medium text-xs">
                        <svg class="animate-spin -ml-0.5 mr-1.5 h-3.5 w-3.5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Downloading...
                    </span>`;
            }

            try {
                const res = await fetch(`${API_BASE}/v1/files/${encodeURIComponent(fileId)}`, {
                    method: "GET",
                    headers: { "accept": "*/*" }
                });

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status} (${res.statusText})`);
                }

                const blob = await res.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                // Force download with the exact artifact filename (preserves .xlsx, .csv, etc.)
                const link = document.createElement("a");
                link.href = blobUrl;
                link.download = filename || fileId;
                document.body.appendChild(link);
                link.click();
                link.remove();

                // Clean up object URL after browser starts the download
                setTimeout(() => window.URL.revokeObjectURL(blobUrl), 3000);

                if (statusEl) {
                    statusEl.innerHTML = `<span class="text-emerald-600 font-semibold text-xs">✓ Downloaded</span>`;
                }
            } catch (err) {
                if (statusEl) {
                    statusEl.innerHTML = `<span class="text-red-600 font-semibold text-xs">Download failed: ${escapeHTML(err.message)}</span>`;
                }
            }
        }

        function renderAttachmentCard(parentContainer, artifact, metaData = {}) {
            const cardId = `att_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
            const statusId = `${cardId}_status`;

            const fileId = artifact.file_id || metaData.file_id;
            const filename = artifact.filename || metaData.filename || fileId;
            const ext = (metaData.extension || filename.split('.').pop() || "FILE").toUpperCase();
            const sizeText = formatBytes(metaData.size_bytes);
            const rowCount = artifact.row_count ?? metaData.row_count;
            const colCount = artifact.column_count ?? metaData.column_count;

            const metaParts = [];
            if (rowCount !== undefined) metaParts.push(`${rowCount} rows`);
            if (colCount !== undefined) metaParts.push(`${colCount} cols`);
            if (sizeText) metaParts.push(sizeText);

            const card = document.createElement("div");
            card.id = cardId;
            card.className = "w-full mt-3 mb-2 p-3.5 bg-emerald-50/60 border border-emerald-200 rounded-xl flex flex-wrap items-center justify-between gap-3 shadow-sm animate-fade-in";

            card.innerHTML = `
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-sm">
                        ${escapeHTML(ext.slice(0, 4))}
                    </div>
                    <div class="min-w-0">
                        <div class="font-semibold text-slate-800 text-sm truncate" title="${escapeHTML(filename)}">${escapeHTML(filename)}</div>
                        <div class="flex items-center gap-2 mt-0.5 text-xs text-slate-500">
                            ${metaParts.length ? `<span>${escapeHTML(metaParts.join(" • "))}</span>` : ""}
                            <span id="${statusId}"></span>
                        </div>
                    </div>
                </div>
                <button type="button"
                        class="download-btn inline-flex items-center px-3.5 py-2 bg-emerald-600 text-white rounded-lg text-xs font-semibold hover:bg-emerald-700 transition-colors shadow-sm shrink-0">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    Download
                </button>
            `;

            card.querySelector(".download-btn").addEventListener("click", () => {
                triggerFileDownload(fileId, filename, statusId);
            });

            parentContainer.appendChild(card);

            // Auto-trigger download immediately
            triggerFileDownload(fileId, filename, statusId);
        }

        // --- Table Fetching & Rendering Logic ---
        async function loadTablePage(containerId, fileId, filename, page = 1, pageSize = 10) {
            const container = document.getElementById(containerId);
            if (!container) return;

            // Smooth Loading Skeleton + Spinner
            container.innerHTML = `
                <div class="p-4 bg-white">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="loader"></div>
                        <span class="text-sm text-blue-600 font-semibold tracking-wide">Loading table data (Page ${page})...</span>
                    </div>
                    <div class="space-y-2">
                        <div class="h-8 rounded skeleton w-full"></div>
                        <div class="h-7 rounded skeleton w-full"></div>
                        <div class="h-7 rounded skeleton w-full"></div>
                        <div class="h-7 rounded skeleton w-11/12"></div>
                    </div>
                </div>`;

            // Format ID: file_id + "_" + filename (without .json)
            const cleanFilename = filename.endsWith('.json') ? filename.slice(0, -5) : filename;
            // const combinedId = `${fileId}_${cleanFilename}`;
            const combinedId = `${fileId}`;


            try {
                const res = await fetch(`${API_BASE}/v1/get_table_response/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "accept": "*/*" },
                    body: JSON.stringify({ file_id: combinedId, page: page, page_size: pageSize })
                });

                if (!res.ok) throw new Error(`HTTP ${res.status} (${res.statusText})`);
                const dataObj = await res.json();

                renderTableHTML(containerId, fileId, filename, dataObj, pageSize);
            } catch (err) {
                container.innerHTML = `<div class="text-red-600 p-4 border border-red-200 bg-red-50 rounded text-sm">Failed to load table data: ${escapeHTML(err.message)}</div>`;
            }
        }

        function renderTableHTML(containerId, fileId, filename, dataObj, requestedPageSize = 10) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const records = dataObj.data || [];
            const pageInfo = dataObj.pagination || {};
            const activePageSize = pageInfo.page_size || requestedPageSize;

            if (records.length === 0) {
                container.innerHTML = `<div class="p-4 text-slate-500 text-sm">No records found.</div>`;
                return;
            }

            // Extract headers (excluding SAP __metadata)
            const headers = Object.keys(records[0]).filter(key => key !== "__metadata");
            const safeFileId = escapeHTML(fileId);
            const safeFilename = escapeHTML(filename);

            let html = `
                <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
                    <span class="text-xs font-bold text-slate-700 uppercase tracking-wider truncate" title="${safeFilename}">
                        Table Preview: ${safeFilename}
                    </span>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-500 font-medium">${pageInfo.total_records ?? records.length} records</span>
                        
                        <!-- EXPORT DROPDOWN -->
                        <select onchange="triggerTableExport('${safeFileId}', '${safeFilename}', this.value, this)" 
                                class="text-xs border border-slate-300 rounded px-2 py-1 bg-white text-slate-700 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer shadow-sm">
                            <option value="">Export As...</option>
                            <option value="xlsx">Excel (.xlsx)</option>
                            <option value="csv">CSV</option>
                            <option value="json">JSON</option>
                            <option value="html">HTML</option>
                            <option value="xml">XML</option>
                            <option value="md">Markdown</option>
                        </select>
                    </div>
                </div>
                <div class="data-table-container">
                    <table class="data-table min-w-full divide-y divide-slate-200 text-xs">
                        <thead>
                            <tr>
                                ${headers.map(h => `<th class="px-4 py-2.5 text-left font-semibold text-slate-700 tracking-wider whitespace-nowrap">${escapeHTML(h)}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-slate-100">`;

            records.forEach(row => {
                html += `<tr class="hover:bg-blue-50/40 transition-colors">`;
                headers.forEach(h => {
                    const val = (row[h] !== null && row[h] !== undefined && row[h] !== "")
                        ? escapeHTML(typeof row[h] === "object" ? JSON.stringify(row[h]) : row[h])
                        : '<span class="text-slate-400 italic">null</span>';
                    html += `<td class="px-4 py-2 text-slate-600 whitespace-nowrap">${val}</td>`;
                });
                html += `</tr>`;
            });

            html += `
                        </tbody>
                    </table>
                </div>`;

            // Pagination Footer
            const currentPage = pageInfo.current_page || 1;
            const totalPages = pageInfo.total_pages || 1;
            const totalRecords = pageInfo.total_records || records.length;

            html += `
                <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-2.5 bg-slate-50 border-t border-slate-200">
                    <div class="flex items-center gap-3 text-xs text-slate-600">
                        <span>Page <strong class="text-slate-800">${currentPage}</strong> of <strong class="text-slate-800">${totalPages}</strong> (${totalRecords} total)</span>
                        <label class="flex items-center gap-1">
                            <span>Rows:</span>
                            <select onchange="loadTablePage('${containerId}', '${safeFileId}', '${safeFilename}', 1, parseInt(this.value))"
                                    class="border border-slate-300 rounded px-1.5 py-0.5 bg-white text-slate-700 text-xs">
                                ${[5, 10, 25, 50].map(size => `<option value="${size}" ${size === activePageSize ? 'selected' : ''}>${size}</option>`).join('')}
                            </select>
                        </label>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="loadTablePage('${containerId}', '${safeFileId}', '${safeFilename}', ${currentPage - 1}, ${activePageSize})"
                                class="px-3 py-1 bg-white border border-slate-300 rounded text-xs font-medium text-slate-700 hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                ${!pageInfo.has_previous ? 'disabled' : ''}>Previous</button>
                        <button onclick="loadTablePage('${containerId}', '${safeFileId}', '${safeFilename}', ${currentPage + 1}, ${activePageSize})"
                                class="px-3 py-1 bg-white border border-slate-300 rounded text-xs font-medium text-blue-600 hover:bg-blue-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                ${!pageInfo.has_next ? 'disabled' : ''}>Next</button>
                    </div>
                </div>`;

            container.innerHTML = html;
            scrollToBottom();
        }

        // --- Core Chat Stream ---
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            const userEmail = document.getElementById("userEmail").value.trim();

            if (!text) return;
            if (!userEmail) { alert("Please enter your email to verify access."); return; }

            input.value = "";
            appendMessage("user", text);
            chatHistory.push({ role: "user", content: text });

            const payload = {
                user_email: userEmail,
                model_name: document.getElementById("modelName").value || "gpt-4o",
                mcp_server_names: document.getElementById("mcpNames").value
                    ? document.getElementById("mcpNames").value.split(",").map(s => s.trim()).filter(Boolean)
                    : [],
                planner: document.getElementById("plannerToggle").checked,
                stream: true,
                messages: chatHistory
            };

            const responseDiv = appendMessage("assistant", "");
            const contentContainer = responseDiv.querySelector(".content-wrapper");

            let fullAssistantText = "";
            let currentTextSpan = null;
            let currentSpanBuffer = "";
            const pendingToolBlocks = []; // FIFO queue to pair tool_call -> tool_result cleanly

            try {
                const res = await fetch(`${API_BASE}/v1/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errData = await res.json();
                    contentContainer.innerHTML = `<span class="text-red-600 font-semibold">Error: ${escapeHTML(errData.error || res.statusText)}</span>`;
                    chatHistory.pop();
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split("\n\n");
                    buffer = parts.pop();

                    for (const part of parts) {
                        if (!part.startsWith("data: ")) continue;

                        let data;
                        try {
                            data = JSON.parse(part.substring(6));
                        } catch (e) {
                            continue;
                        }

                        if (data.type === "text") {
                            fullAssistantText += data.chunk;
                            if (!currentTextSpan) {
                                currentTextSpan = document.createElement("div");
                                currentTextSpan.className = "response-text my-1";
                                contentContainer.appendChild(currentTextSpan);
                                currentSpanBuffer = "";
                            }
                            currentSpanBuffer += data.chunk;
                            currentTextSpan.textContent = currentSpanBuffer;
                        }
                        else if (data.type === "tool_call") {
                            // Close current text block so post-tool text renders below the tool/table/attachment
                            currentTextSpan = null;

                            const toolDetails = document.createElement("details");
                            toolDetails.className = "tool-block bg-slate-100 p-3 my-2.5 rounded-lg border border-slate-300 shadow-sm animate-fade-in";
                            toolDetails.innerHTML = `
                                <summary class="cursor-pointer text-blue-700 font-bold flex items-center outline-none select-none">
                                    <svg class="w-4 h-4 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    </svg>
                                    Executing: ${escapeHTML(data.name)}
                                </summary>
                                <div class="mt-2">
                                    <div class="text-[11px] uppercase font-bold text-slate-500 mb-1">Arguments</div>
                                    <pre class="text-slate-700 p-2 bg-slate-50 rounded border border-slate-200 text-xs overflow-x-auto max-h-40">${escapeHTML(JSON.stringify(data.args, null, 2))}</pre>
                                </div>
                                <div class="tool-result mt-2 pt-2 border-t border-slate-200">
                                    <div class="flex items-center text-blue-600 font-medium text-xs">
                                        <svg class="animate-spin -ml-0.5 mr-2 h-3.5 w-3.5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        Waiting for response...
                                    </div>
                                </div>
                            `;
                            contentContainer.appendChild(toolDetails);
                            pendingToolBlocks.push({ name: data.name, el: toolDetails });
                        }
                        else if (data.type === "tool_result") {
                            currentTextSpan = null;

                            // Find matching tool block (or fallback to oldest pending block)
                            let matchIdx = pendingToolBlocks.findIndex(item => item.name === data.name);
                            if (matchIdx === -1) matchIdx = 0;
                            const toolEntry = pendingToolBlocks.length ? pendingToolBlocks.splice(matchIdx, 1)[0] : null;

                            // Parse stringified JSON from tool if applicable
                            let parsedResult = data.result;
                            if (typeof data.result === "string") {
                                try { parsedResult = JSON.parse(data.result); } catch (e) {}
                            }

                            // 1. ALWAYS show the raw tool response inside the tool block's result section
                            if (toolEntry && toolEntry.el) {
                                const resDiv = toolEntry.el.querySelector(".tool-result");
                                const formattedRaw = formatRawResultForToolBox(data.result, parsedResult);
                                const statusMsg = (parsedResult && parsedResult.message)
                                    ? `✓ ${escapeHTML(parsedResult.message)}`
                                    : "✓ Completed";

                                resDiv.innerHTML = `
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="text-[11px] uppercase font-bold text-slate-500">Tool Response</span>
                                        <span class="text-emerald-600 font-semibold text-xs">${statusMsg}</span>
                                    </div>
                                    <pre class="text-slate-700 p-2 bg-white rounded border border-slate-200 text-xs overflow-auto max-h-52 whitespace-pre-wrap break-words">${escapeHTML(formattedRaw)}</pre>
                                `;
                            }

                            // 2. Separately render rich UI components in the main chat bubble based on response_type / preview_type
                            if (parsedResult && parsedResult.response_type === "file" && Array.isArray(parsedResult.artifacts)) {
                                for (const artifact of parsedResult.artifacts) {
                                    if (artifact.preview_type === "table") {
                                        const tableId = `table_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
                                        const mainTableContainer = document.createElement("div");
                                        mainTableContainer.id = tableId;
                                        mainTableContainer.className = "w-full mt-3 mb-2 animate-fade-in shadow-sm border border-slate-200 rounded-xl overflow-hidden bg-white";
                                        contentContainer.appendChild(mainTableContainer);

                                        setTimeout(()=>{loadTablePage(tableId, artifact.file_id, artifact.filename, 1, 10)}, 2000) 
                                    }
                                    else if (artifact.preview_type === "attachment") {
                                        renderAttachmentCard(contentContainer, artifact, parsedResult.data || {});
                                    }
                                    // Future file preview types (e.g., pdf, image) can be added here
                                }
                            }
                            else if (parsedResult && parsedResult.response_type === "chart") {
                                const chartId = `chart_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
                                
                                // Create container in the main chat bubble
                                const mainChartContainer = document.createElement("div");
                                mainChartContainer.id = `${chartId}_container`;
                                mainChartContainer.className = "w-full mt-3 mb-2 animate-fade-in shadow-sm border border-slate-200 rounded-xl overflow-hidden bg-white";
                                
                                // 1. Set the initial loading placeholder
                                mainChartContainer.innerHTML = `
                                    <div class="p-8 flex flex-col items-center justify-center gap-3 bg-slate-50 h-[300px]">
                                        <div class="loader"></div>
                                        <span class="text-sm text-blue-600 font-semibold tracking-wide">Rendering visualization...</span>
                                    </div>
                                `;
                                contentContainer.appendChild(mainChartContainer);
                                scrollToBottom();

                                // 2. Wait 2 seconds, then render the actual chart
                                setTimeout(() => {
                                    // Inject header and the actual Plotly target div
                                    mainChartContainer.innerHTML = `
                                        <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                                            <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">
                                                Data Visualization
                                            </span>
                                        </div>
                                        <div id="${chartId}" class="w-full h-[400px] p-2 bg-white"></div>
                                    `;
                                    
                                    // Check if Plotly loaded, then render
                                    if (typeof Plotly !== 'undefined' && parsedResult.plotly_data) {
                                        const plotData = parsedResult.plotly_data.data || [];
                                        const plotLayout = parsedResult.plotly_data.layout || {};
                                        
                                        // Force it to fit nicely in the chat window
                                        plotLayout.autosize = true;
                                        plotLayout.margin = { l: 40, r: 20, t: 40, b: 40 };
                                        
                                        Plotly.newPlot(chartId, plotData, plotLayout, {
                                            responsive: true,
                                            displayModeBar: true,
                                            displaylogo: false
                                        });
                                    } else {
                                        document.getElementById(chartId).innerHTML = `
                                            <div class="text-red-500 p-4 text-sm font-semibold">
                                                Failed to render chart. Plotly library missing or invalid data.
                                            </div>
                                        `;
                                    }
                                    scrollToBottom();
                                }, 2000);
                            }
                        }
                        else if (data.type === "task_start") {
                            currentTextSpan = null;
                            const taskBadge = document.createElement("div");
                            taskBadge.className = "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800 mb-2 mt-1 animate-fade-in";
                            taskBadge.innerHTML = `
                                <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                                </svg>
                                Task ${escapeHTML(data.task_id)}: ${escapeHTML(data.description)}`;
                            contentContainer.appendChild(taskBadge);
                        }
                        else if (data.type === "done") {
                            const metrics = document.createElement("div");
                            metrics.className = "text-[11px] text-slate-400 mt-4 pt-2 border-t border-slate-100 flex justify-end items-center animate-fade-in";
                            metrics.innerHTML = `
                                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                </svg>
                                Tokens: ${data.input_tokens} In | ${data.output_tokens} Out`;
                            contentContainer.appendChild(metrics);
                        }
                        else if (data.type === "error" || data.type === "fallback") {
                            currentTextSpan = null;
                            const errDiv = document.createElement("div");
                            errDiv.className = `p-3 mt-2 text-sm rounded-lg animate-fade-in flex items-start ${
                                data.type === 'error'
                                    ? 'bg-red-50 text-red-700 border border-red-200'
                                    : 'bg-orange-50 text-orange-700 border border-orange-200'
                            }`;
                            errDiv.innerHTML = `
                                <svg class="w-5 h-5 mr-2 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                                </svg>
                                <div>
                                    <strong>${escapeHTML(data.message)}</strong>
                                    ${data.details ? `<br><span class="text-xs opacity-80">${escapeHTML(typeof data.details === 'object' ? JSON.stringify(data.details) : data.details)}</span>` : ''}
                                </div>`;
                            contentContainer.appendChild(errDiv);
                        }
                    }
                    scrollToBottom();
                }

                chatHistory.push({ role: "assistant", content: fullAssistantText });

            } catch (err) {
                contentContainer.innerHTML += `<div class="text-red-500 mt-3 p-3 bg-red-50 rounded-lg text-sm border border-red-200">Connection failed: ${escapeHTML(err.message)}</div>`;
                chatHistory.pop();
            }
        }

        function handleEnter(e) {
            if (e.key === "Enter") sendMessage();
        }

    // --- Table Export Logic ---
        async function triggerTableExport(fileId, filename, format, selectElement) {
            if (!format) return; // Ignore placeholder selection
            
            // Reset the dropdown back to "Export As..."
            if (selectElement) selectElement.value = "";
            
            const url = `${API_BASE}/v1/files/${encodeURIComponent(fileId)}?export=true&export_format=${encodeURIComponent(format)}`;
            
            try {
                const res = await fetch(url, { method: "GET", headers: { "accept": "*/*" } });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const blob = await res.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                // Construct clean filename (swap .json to the new format)
                const cleanName = filename.substring(0, filename.lastIndexOf('.')) || filename;
                const exportFilename = `${cleanName}.${format}`;
                
                const link = document.createElement("a");
                link.href = blobUrl;
                link.download = exportFilename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                
                setTimeout(() => window.URL.revokeObjectURL(blobUrl), 3000);
            } catch (err) {
                alert(`Export failed: ${err.message}`);
            }
        }
    </script>
