<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRBOT Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { max-height: 70vh; overflow-y: auto; }
        .tool-block { font-family: monospace; font-size: 0.85rem; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen items-center justify-center">

    <div class="w-full max-w-5xl bg-white shadow-xl rounded-lg overflow-hidden flex flex-col h-[90vh]">
        <!-- Header -->
        <div class="bg-blue-800 text-white p-4 flex justify-between items-center">
            <h1 class="font-bold text-xl">AIRBOT Enterprise</h1>
            <div class="flex items-center gap-3">
                <input type="email" id="userEmail" placeholder="Your Email" class="text-black p-1 text-sm rounded w-40">
                <input type="text" id="modelName" placeholder="Model Name (e.g. gpt-4o)" class="text-black p-1 text-sm rounded w-40">
                <input type="text" id="mcpNames" placeholder="MCPs (comma sep)" class="text-black p-1 text-sm rounded w-40">
                <label class="flex items-center gap-1 text-sm whitespace-nowrap">
                    <input type="checkbox" id="plannerToggle" class="w-4 h-4"> Planner
                </label>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chatBox" class="chat-container flex-1 p-6 flex flex-col gap-4 bg-slate-50"></div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t flex gap-2">
            <input type="text" id="userInput" placeholder="Ask the agent..." class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onkeypress="handleEnter(event)">
            <button onclick="sendMessage()" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700">Send</button>
        </div>
    </div>

    <script>
        let chatHistory = [];

        function appendMessage(role, content) {
            const div = document.createElement("div");
            div.className = `p-3 rounded-lg max-w-[80%] ${role === 'user' ? 'bg-blue-100 self-end' : 'bg-white border self-start'}`;
            div.innerHTML = `<div class="whitespace-pre-wrap">${content}</div>`;
            document.getElementById("chatBox").appendChild(div);
            div.scrollIntoView();
            return div;
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            const userEmail = document.getElementById("userEmail").value.trim();
            
            if (!text) return;
            if (!userEmail) {
                alert("Please enter your email to verify access.");
                return;
            }

            input.value = "";
            appendMessage("user", text);
            chatHistory.push({ role: "user", content: text });

            const modelName = document.getElementById("modelName").value || "gpt-4o";
            const mcpInput = document.getElementById("mcpNames").value;
            const mcps = mcpInput ? mcpInput.split(",").map(s => s.trim()) : [];
            const usePlanner = document.getElementById("plannerToggle").checked;

            const payload = {
                user_email: userEmail,
                model_name: modelName,
                mcp_server_names: mcps,
                planner: usePlanner,
                stream: true,
                messages: chatHistory
            };

            const responseDiv = appendMessage("assistant", "");
            const contentContainer = responseDiv.querySelector("div");
            let assistantText = "";
            let currentToolDetails = null;

            try {
                const res = await fetch("http://localhost:8000/v1/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errData = await res.json();
                    contentContainer.innerHTML = `<span class="text-red-600 font-semibold">Error: ${errData.error || res.statusText}</span>`;
                    chatHistory.pop();
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split("\n\n");
                    buffer = parts.pop(); 

                    for (const part of parts) {
                        if (part.startsWith("data: ")) {
                            const data = JSON.parse(part.substring(6));
                            
                            if (data.type === "text") {
                                assistantText += data.chunk;
                                let textSpan = contentContainer.querySelector('.response-text');
                                if (!textSpan) {
                                    textSpan = document.createElement("span");
                                    textSpan.className = "response-text";
                                    contentContainer.appendChild(textSpan);
                                }
                                textSpan.innerText = assistantText;
                            } 
                            else if (data.type === "tool_call") {
                                currentToolDetails = document.createElement("details");
                                currentToolDetails.className = "tool-block bg-slate-100 p-2 my-2 rounded border border-slate-300";
                                currentToolDetails.innerHTML = `
                                    <summary class="cursor-pointer text-blue-700 font-semibold mb-1">⚙️ Executing: ${data.name}</summary>
                                    <div class="text-slate-600 mb-1">Args: ${JSON.stringify(data.args)}</div>
                                    <div class="tool-result text-green-700 mt-1 pt-1 border-t border-slate-300">Executing...</div>
                                `;
                                contentContainer.appendChild(currentToolDetails);
                            }
                            else if (data.type === "tool_result") {
                                if (currentToolDetails) {
                                    const resDiv = currentToolDetails.querySelector('.tool-result');
                                    resDiv.innerText = `Result: ${typeof data.result === 'object' ? JSON.stringify(data.result) : data.result}`;
                                    currentToolDetails = null;
                                }
                            }
                            else if (data.type === "task_start") {
                                const taskBadge = document.createElement("div");
                                taskBadge.className = "text-xs font-bold text-slate-500 mb-1 uppercase tracking-wider";
                                taskBadge.innerText = `▶ Task ${data.task_id}: ${data.description}`;
                                contentContainer.appendChild(taskBadge);
                            }
                            else if (data.type === "done") {
                                const metrics = document.createElement("div");
                                metrics.className = "text-xs text-slate-400 mt-3 pt-2 border-t text-right";
                                metrics.innerText = `Tokens: ${data.input_tokens} In | ${data.output_tokens} Out`;
                                contentContainer.appendChild(metrics);
                            }
                            else if (data.type === "error" || data.type === "fallback") {
                                const errDiv = document.createElement("div");
                                errDiv.className = `p-2 mt-2 text-sm rounded ${data.type === 'error' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}`;
                                errDiv.innerText = `${data.message} ${data.details ? '- ' + data.details : ''}`;
                                contentContainer.appendChild(errDiv);
                            }
                        }
                    }
                    responseDiv.scrollIntoView();
                }
                
                chatHistory.push({ role: "assistant", content: assistantText });

            } catch (err) {
                contentContainer.innerHTML += `<div class="text-red-500 mt-2">Connection failed.</div>`;
                chatHistory.pop();
            }
        }

        function handleEnter(e) {
            if (e.key === "Enter") sendMessage();
        }
    </script>
</body>
</html>
